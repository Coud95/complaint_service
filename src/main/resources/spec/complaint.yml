openapi: "3.0.0"
info:
  title:  ComplaintService
  version: 1.0.0
paths:
  /complaint/{id}:
    get:
      summary: Info for a specific complaint
      operationId: getComplaintById
      parameters:
        - name: id
          in: path
          description: ID of complaint to return
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '404':
          description: Complaint not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /complaint:
    get:
      summary: Get all complaints
      operationId: getAllComplaints
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintArray'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add a new complaint
      operationId: addComplaint
      requestBody:
        description: Create a new complaint
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Complaint'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '400':
          description: Invalid input
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      summary: Edit an existing complaint
      operationId: editComplaint
      requestBody:
        description: Edit an existent complaint
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditComplaint'
        required: true
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '404':
          description: Complaint not found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Complaint:
      type: object
      required:
        - productId
        - description
        - submitter
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        description:
          type: string
        creationDate:
          type: string
        submitter:
          $ref: '#/components/schemas/Submitter'
        country:
          type: string
        submitCount:
          type: integer
          format: int32
    Submitter:
      type: object
      required:
        - firstName
        - lastName
        - emailAddress
      properties:
        firstName:
          type: string
        lastName:
          type: string
        emailAddress:
          type: string
          format: email
    EditComplaint:
      type: object
      required:
        - complaintId
        - description
      properties:
        complaintId:
          type: integer
          format: int64
        description:
          type: string
    ComplaintArray:
      type: array
      items:
          $ref: '#/components/schemas/Complaint'
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string